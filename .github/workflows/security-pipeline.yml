name: Security CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  security-scans:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create reports directory
        run: mkdir -p reports

      - name: Install dependencies and scanners
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit semgrep pip-audit

      - name: Bandit (SAST)
        continue-on-error: true
        run: bandit -r app/ -f json -o reports/bandit-report.json

      - name: Semgrep (SAST)
        continue-on-error: true
        run: >
          semgrep scan
          --config security/semgrep/rules.yml
          --json
          --output reports/semgrep-report.json
          app/

      - name: pip-audit (dependencies)
        continue-on-error: true
        run: pip-audit -r requirements.txt -f json -o reports/dependency-report.json

      - name: Build Docker image
        run: docker build -t vulnfinbot:latest .

      - name: Trivy image scan (JSON report)
        continue-on-error: true
        run: >
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v ${{ github.workspace }}/reports:/reports
          -v ${{ runner.temp }}/trivy-cache:/root/.cache/
          aquasec/trivy:latest image
          --format json
          --output /reports/trivy-report.json
          vulnfinbot:latest

      - name: Trivy summary (HIGH and CRITICAL)
        continue-on-error: true
        run: >
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v ${{ runner.temp }}/trivy-cache:/root/.cache/
          aquasec/trivy:latest image
          --severity HIGH,CRITICAL
          vulnfinbot:latest

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/
          if-no-files-found: warn



  dast-zap:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create reports directory
        run: |
          mkdir -p reports
          chmod -R a+w reports

      - name: Build and start application
        run: |
          docker build -t vulnfinbot:latest .
          docker run -d -p 5000:5000 --name vulnfinbot vulnfinbot:latest
          for i in $(seq 1 20); do
            curl -sf http://localhost:5000/health && break
            sleep 2
          done

      - name: OWASP ZAP baseline scan
        continue-on-error: true
        run: >
          docker run --rm --network host
          -v ${{ github.workspace }}/reports:/zap/wrk/:rw
          ghcr.io/zaproxy/zaproxy:stable
          zap-baseline.py -t http://localhost:5000 -J zap-report.json

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: reports/
          if-no-files-found: warn